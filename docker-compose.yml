version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      ##- DEBUG_MODE=true  # Set to 'true' for debugging, 'false' for production
      - DEBUG_MODE=false  # Set to 'true' for debugging, 'false' for production

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile.fastapi
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG_MODE=true  # Set to 'true' for debugging, 'false' for production
      ##- DEBUG_MODE=false  # Set to 'true' for debugging, 'false' for production

